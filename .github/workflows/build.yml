name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore src/MacroFlow.App/MacroFlow.App.csproj
          dotnet restore tests/MacroFlow.Core.Tests/MacroFlow.Core.Tests.csproj
      - name: Build application
        run: dotnet build src/MacroFlow.App/MacroFlow.App.csproj --configuration Release --no-restore
      - name: Build tests
        run: dotnet build tests/MacroFlow.Core.Tests/MacroFlow.Core.Tests.csproj --configuration Release --no-restore
      - name: Tests
        run: dotnet run --project tests/MacroFlow.Core.Tests --configuration Release --no-build
      - name: Publish portable
        run: dotnet publish src/MacroFlow.App/MacroFlow.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/portable-win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
      - uses: actions/upload-artifact@v4
        with:
          name: MacroFlow-portable-win-x64
          path: artifacts/portable-win-x64/
