name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore src/MacroFlow.App/MacroFlow.App.csproj
          dotnet restore tests/MacroFlow.Core.Tests/MacroFlow.Core.Tests.csproj
      - name: Build application
        run: dotnet build src/MacroFlow.App/MacroFlow.App.csproj --configuration Release --no-restore
      - name: Build tests
        run: dotnet build tests/MacroFlow.Core.Tests/MacroFlow.Core.Tests.csproj --configuration Release --no-restore
      - name: Tests
        run: dotnet run --project tests/MacroFlow.Core.Tests --configuration Release --no-build
